name: Build APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачивание твоего кода
        uses: actions/checkout@v4

      - name: 2. Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Автопочинка папок, gradle.properties и ключа
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/selfapk/game000000000000

          # Если файлы случайно попали в app/app/..., переносим их на правильное место:
          find . -name "AndroidManifest.xml" -exec cp {} app/src/main/AndroidManifest.xml \;
          find . -name "MainActivity.kt" -exec cp {} app/src/main/java/com/selfapk/game000000000000/MainActivity.kt \;

          keytool -genkeypair -v \
            -keystore app/src/main/assets/debug.p12 \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 4. Установка Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 5. Компиляция APK
        run: gradle assembleDebug

      - name: 6. Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK-Converter
          path: app/build/outputs/apk/debug/app-debug.apk
          
